<!doctype html><html lang="{{ lang }}" dir="{{ dir }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t('login_title') }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-page"><div class="auth-shell"><div class="auth-brand"><div class="brand-mark">✉</div><div><strong>{{ t('bot_name') }}</strong><span>{{ t('bot_management') }}</span></div></div><div class="auth-card"><div class="eyebrow">{{ t('admin_panel') }}</div><h1>{{ t('welcome') }}</h1><p class="muted">{{ t('login_hint') }}</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/login" class="form"><label>{{ t('username') }}<input name="username" autocomplete="username" required></label><label>{{ t('password') }}<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary wide" type="submit">{{ t('login') }} →</button></form></div><div class="auth-footer">{{ t('mail_service') }}</div></div></body></html>
